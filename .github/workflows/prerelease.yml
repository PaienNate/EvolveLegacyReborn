name: prerelease

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -DEVOLVE_BUILD_BINTRUST=ON
          -DEVOLVE_BINTRUST_INTERNAL_SERVER=ON

      - name: Build Release
        run: cmake --build build --config Release

      - name: Resolve release metadata
        shell: pwsh
        run: |
          $shortSha = "${env:GITHUB_SHA}".Substring(0, 7)
          "SHORT_SHA=$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_TAG=pre-main-${env:GITHUB_RUN_NUMBER}-$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_NAME=Prerelease main #${env:GITHUB_RUN_NUMBER} ($shortSha)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package prerelease zip
        shell: pwsh
        run: |
          $bintrust = Get-ChildItem -Recurse -Filter BINTRUST.dll | Select-Object -First 1 -ExpandProperty FullName
          if (-not $bintrust) {
            throw "BINTRUST.dll not found after build"
          }

          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $zipPath = Join-Path $PWD "artifacts\EvolveLegacyReborn-dev-win64-${env:SHORT_SHA}.zip"
          & .\scripts\package-prerelease.ps1 -BintrustPath $bintrust -OutputZip $zipPath
          "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-win64
          path: ${{ env.ZIP_PATH }}

      - name: Publish GitHub prerelease
        shell: pwsh
        run: |
          gh release create `
            "${env:RELEASE_TAG}" `
            "${env:ZIP_PATH}" `
            --title "${env:RELEASE_NAME}" `
            --notes-file "packaging/README-prerelease.md" `
            --prerelease `
            --target "${env:GITHUB_SHA}"
