name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  linux-cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DEVOLVE_BUILD_HARNESS=ON

      - name: Build logic tests and harness
        run: cmake --build build --target server_logic_tests server_harness

      - name: Run logic tests
        run: ctest --test-dir build --output-on-failure -R server_logic_tests

      - name: Run HTTPS smoke test
        run: |
          ./build/server_core/server_harness \
            EvolveServerEmulator/EvolveCrack \
            2000 \
            127.0.0.1 \
            EvolveServerEmulator/certs/mitmproxy-ca-cert.pem \
            EvolveServerEmulator/certs/mitmproxy-ca.pem \
            10 &
          HARNESS_PID=$!
          sleep 1
          curl --silent --show-error \
            --cacert EvolveServerEmulator/certs/mitmproxy-ca-cert.pem \
            --resolve 508223012e5a5ff19f30a391b2bdadc0.my.2k.com:2000:127.0.0.1 \
            https://508223012e5a5ff19f30a391b2bdadc0.my.2k.com:2000/doorman/1 > /tmp/doorman.json
          grep '"isOnline": true' /tmp/doorman.json
          wait $HARNESS_PID

  windows-cmake:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -DEVOLVE_BUILD_BINTRUST=ON
          -DEVOLVE_BINTRUST_INTERNAL_SERVER=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Upload BINTRUST artifact
        uses: actions/upload-artifact@v4
        with:
          name: bintrust-win64
          path: |
            build/EvolveHooker/Release/BINTRUST.dll
            EvolveHooker/Dll1/EvolveLogging.ini

  linux-mingw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 cmake ninja-build

      - name: Configure
        run: >
          cmake -S . -B build-mingw -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-w64-x86_64.cmake
          -DCMAKE_BUILD_TYPE=Release
          -DEVOLVE_BUILD_BINTRUST=ON
          -DEVOLVE_BUILD_TESTING=OFF

      - name: Build
        run: cmake --build build-mingw

      - name: Upload MinGW artifact
        uses: actions/upload-artifact@v4
        with:
          name: bintrust-mingw64
          path: build-mingw/EvolveHooker/BINTRUST.dll
