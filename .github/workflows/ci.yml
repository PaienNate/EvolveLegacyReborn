name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  linux-cmake:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          if [ ! -d "$HOME/.cache/vcpkg/.git" ]; then
            git clone https://github.com/microsoft/vcpkg "$HOME/.cache/vcpkg"
          fi
          "$HOME/.cache/vcpkg/bootstrap-vcpkg.sh"

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build-vcpkg
          -DCMAKE_TOOLCHAIN_FILE=$HOME/.cache/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DEVOLVE_BUILD_RUNTIME=ON
          -DEVOLVE_BUILD_HARNESS=ON

      - name: Build logic tests and harness
        shell: bash
        run: cmake --build build-vcpkg --target server_logic_tests server_harness

      - name: Run logic tests
        shell: bash
        run: ctest --test-dir build-vcpkg --output-on-failure -R server_logic_tests

      - name: Run HTTPS smoke test
        shell: bash
        run: |
          ./build-vcpkg/server_core/server_harness \
            EvolveServerEmulator/EvolveCrack \
            2000 \
            127.0.0.1 \
            EvolveServerEmulator/certs/mitmproxy-ca-cert.pem \
            EvolveServerEmulator/certs/mitmproxy-ca.pem \
            10 &
          HARNESS_PID=$!
          sleep 1
          curl --silent --show-error \
            --cacert EvolveServerEmulator/certs/mitmproxy-ca-cert.pem \
            --resolve 508223012e5a5ff19f30a391b2bdadc0.my.2k.com:2000:127.0.0.1 \
            https://508223012e5a5ff19f30a391b2bdadc0.my.2k.com:2000/doorman/1 > /tmp/doorman.json
          grep '"isOnline": true' /tmp/doorman.json
          wait $HARNESS_PID

  windows-msbuild:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg

    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:VCPKG_ROOT\.git")) {
            git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          }
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

      - name: Build Release x64 solution
        shell: pwsh
        run: |
          msbuild EvolveHooker\EvolveHooker.sln /m /p:Configuration=Release /p:Platform=x64 /p:VcpkgEnableManifest=true

      - name: Upload BINTRUST artifact
        uses: actions/upload-artifact@v4
        with:
          name: bintrust-win64
          path: |
            **/BINTRUST.dll
            EvolveHooker/Dll1/EvolveLogging.ini
            packaging/EvolveLogging.internal.example.ini
            packaging/README-prerelease.md
            THIRD_PARTY_NOTICES.txt
